<html lang="uz">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b10">
<title>NikMaker Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b10;color:#f5f6fa;font-family:Arial,sans-serif}
button,input,select{font:inherit}
.app{max-width:650px;margin:auto;padding:17px 13px 35px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:24px;font-weight:900;letter-spacing:1px}
.logo span{color:#299cff}
select{background:#171e2b;color:white;border:1px solid #29364b;border-radius:10px;padding:9px}
h2{font-size:16px;margin:22px 0 12px}
.inputbox{background:#121722;border:1px solid #29364b;border-radius:14px;padding:13px}
input{width:100%;background:transparent;border:0;outline:0;color:white;font-size:17px;padding:8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.btn{border:0;border-radius:11px;padding:13px 8px;font-weight:bold;background:#202a3a;color:white;cursor:pointer}
.primary{background:#1688ed}
.green{background:#168c68}
button:active{opacity:.75;transform:scale(.98)}
.emojis{display:flex;flex-wrap:wrap;gap:7px}
.emoji{background:#171e2b;border:1px solid #29364b;border-radius:9px;padding:9px;font-size:19px;color:white;cursor:pointer}
.emoji.active{border-color:#1688ed;background:#142b45}
.pages{display:flex;gap:6px;overflow-x:auto;padding:3px 0 12px}
.page{min-width:37px;padding:9px 5px;border:1px solid #29364b;background:#151b26;color:white;border-radius:9px}
.page.active{background:#1688ed;border-color:#1688ed}
.styles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.style{background:#121722;border:1px solid #263248;border-radius:12px;padding:11px;min-width:0}
.style.selected{border:1px solid #1688ed;background:#142338}
.style-text{font-size:16px;overflow-wrap:anywhere;min-height:26px;margin-bottom:10px;line-height:1.5}
.style-bottom{display:flex;justify-content:space-between;align-items:center;gap:5px}
.number{font-size:11px;color:#8190a7}
.small{border:0;border-radius:7px;padding:7px 10px;background:#26364b;color:white}
.selected .small{background:#1688ed}
.empty{grid-column:1/-1;padding:24px;text-align:center;background:#121722;border-radius:12px;color:#8190a7}
.footer{text-align:center;color:#66758c;font-size:12px;margin-top:25px}
.ad-list{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ad{display:block;background:#121722;border:1px solid #263248;border-radius:11px;overflow:hidden;text-decoration:none;color:white}
.ad img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.ad div{padding:9px;font-size:12px}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">NIK<span>MAKER</span></div>
  <select id="language" onchange="setLanguage(this.value)">
    <option value="uz">UZ</option>
    <option value="ru">RU</option>
    <option value="en">EN</option>
  </select>
</header>

<h2 id="title">✍️ Nik yoki matn kiriting</h2>
<div class="inputbox">
  <input id="nickname" maxlength="64" placeholder="Nikni kiriting..." oninput="generate()">
  <div class="buttons">
    <button class="btn primary" id="makeBtn" onclick="generate()">✨ Yasash</button>
    <button class="btn" id="randomBtn" onclick="randomNickname()">🎲 Tasodifiy nik</button>
    <button class="btn green" id="copyBtn" onclick="copySelected()">📋 Nusxalash</button>
    <button class="btn" id="clearBtn" onclick="clearAll()">🗑 Tozalash</button>
  </div>
</div>

<h2 id="emojiTitle">😀 Emoji qo‘shish</h2>
<div class="emojis" id="emojiList"></div>

<h2 id="stylesTitle">🎨 100 ta nik stili</h2>
<div class="pages" id="pages"></div>
<div class="styles" id="styles"></div>

<div class="buttons">
  <button class="btn" id="copyPageBtn" onclick="copyPage()">📋 Sahifani nusxalash</button>
  <button class="btn primary" id="nextBtn" onclick="nextPage()">Keyingi →</button>
</div>

<h2 id="adsTitle">📢 Reklama</h2>
<div class="ad-list" id="ads">
  <div class="empty">Reklamalar hozircha mavjud emas</div>
</div>

<div class="footer">NIKMAKER MINI APP · 100 STYLES</div>
</div>

let lang="uz";
let page=0;
let selected=0;
let results=[];
let emojiMode=false;
let chosenEmoji="";

function stylize(text,index){
  const font=index%10;
  const decoration=Math.floor(index/10)%10;
  let converted="";

  for(const ch of text){
    const lower=NORMAL.indexOf(ch.toLowerCase());

    if(lower===-1){
      converted+=ch;
      continue;
    }

    if(ch!==ch.toLowerCase()){
      converted+=Array.from(UPPER_FONT_STRINGS[font])[lower]||ch;
    }else{
      converted+=Array.from(FONT_STRINGS[font])[lower]||ch;
    }
  }

  const d=DECORATIONS[decoration];
  return d[0]+converted+d[1];
}

function generate(){
  const text=document.getElementById("nickname").value.trim();

  if(!text){
    results=[];
    render();
    return;
  }

  results=Array.from({length:100},(_,i)=>{
    let value=stylize(text,i);
    if(emojiMode&&chosenEmoji)value=chosenEmoji+" "+value+" "+chosenEmoji;
    return value;
  });

  selected=0;
  render();
}

function randomNickname(){
  const name=RANDOM_NAMES[Math.floor(Math.random()*RANDOM_NAMES.length)];
  const style=Math.floor(Math.random()*100);
  let result=stylize(name,style);

  if(emojiMode){
    const e=EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    result=e+" "+result+" "+e;
  }

  results=Array(100).fill(result);
  selected=0;
  page=0;
  document.getElementById("nickname").value=name;
  render();
}

function addEmoji(value){
  chosenEmoji=value;
  emojiMode=true;
  generate();
  renderEmoji();
}

function clearAll(){
  document.getElementById("nickname").value="";
  results=[];
  selected=0;
  page=0;
  emojiMode=false;
  chosenEmoji="";
  render();
}

function setLanguage(value){
  lang=value;
  const t=LANG[lang];

  document.getElementById("title").textContent=t.title;
  document.getElementById("nickname").placeholder=t.placeholder;
  document.getElementById("makeBtn").textContent=t.make;
  document.getElementById("randomBtn").textContent=t.random;
  document.getElementById("copyBtn").textContent=t.copy;
  document.getElementById("clearBtn").textContent=t.clear;
  document.getElementById("emojiTitle").textContent=t.emoji;
  document.getElementById("stylesTitle").textContent=t.styles;
  document.getElementById("copyPageBtn").textContent=t.copyPage;
  document.getElementById("nextBtn").textContent=t.next;
  document.getElementById("adsTitle").textContent=t.ads;

  render();
}

function renderEmoji(){
  document.getElementById("emojiList").innerHTML=EMOJIS.map(e=>
    `<button class="emoji ${chosenEmoji===e?"active":""}" onclick="addEmoji('${e}')">${e}</button>`
  ).join("");
}

function renderPages(){
  document.getElementById("pages").innerHTML=Array.from({length:10},(_,i)=>
    `<button class="page ${page===i?"active":""}" onclick="changePage(${i})">${i+1}</button>`
  ).join("");
}

function renderStyles(){
  const container=document.getElementById("styles");

  if(!results.length){
    container.innerHTML=`<div class="empty">${LANG[lang].emptyInput}</div>`;
    return;
  }

  const start=page*10;
  container.innerHTML=results.slice(start,start+10).map((value,i)=>{
    const index=start+i;
    return `
      <div class="style ${selected===index?"selected":""}" onclick="selectStyle(${index})">
        <div class="style-text">${escapeHTML(value)}</div>
        <div class="style-bottom">
          <span class="number">#${index+1}</span>
          <button class="small" onclick="event.stopPropagation();copyOne(${index})">${LANG[lang].selected}</button>
        </div>
      </div>`;
  }).join("");
}

function escapeHTML(text){
  return text.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function render(){
  renderEmoji();
  renderPages();
  renderStyles();
}

function selectStyle(index){
  selected=index;
  renderStyles();
}

function changePage(value){
  page=Math.max(0,Math.min(9,value));
  render();
}

function nextPage(){
  page=(page+1)%10;
  render();
}

async function copyText(text){
  if(!text)return;

  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
    }else{
      const area=document.createElement("textarea");
      area.value=text;
      area.style.position="fixed";
      area.style.opacity="0";
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
    }

    if(tg&&tg.showPopup){
      tg.showPopup({message:LANG[lang].copied});
    }else{
      alert(LANG[lang].copied);
    }
  }catch(e){
    alert("Nusxalashda xatolik yuz berdi");
  }
}

function copyOne(index){
  selected=index;
  copyText(results[index]);
}

function copySelected(){
  if(!results.length)return alert(LANG[lang].emptyInput);
  copyText(results[selected]);
}
